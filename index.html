<!doctype html><html><head><meta charset="utf-8"><title>Meditation Timer</title><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{font-family:Arial,sans-serif;color:#f5f2e9}#o{width:100%;height:100%;display:flex;align-items:center;justify-content:center}.card{width:min(92vw,760px);padding:28px 42px;border:1px solid rgba(255,255,255,.12);border-radius:22px;background:linear-gradient(180deg,rgba(12,14,14,.72),rgba(12,14,14,.48));backdrop-filter:blur(7px);box-shadow:0 14px 45px rgba(0,0,0,.18);text-align:center}#t{font:600 clamp(58px,9vw,112px)/1 "Courier New",monospace;letter-spacing:.04em;font-variant-numeric:tabular-nums}#s{height:20px;margin-top:10px;color:rgba(245,242,233,.62);font:12px Arial}</style></head><body><div id="o"><div class="card"><div id="t">20:00</div><div id="s">Ready</div></div></div><audio id="a" preload="auto"></audio><script>const CH="meditation-timer-v2",KEY="meditationTimerConfig";const bc=new BroadcastChannel(CH);const DEF={duration:1200,warmup:10,endBell:true,defaultBell:"sounds/Bowl_Bright.mp3",startBells:[{sound:"sounds/Bowl_Bright.mp3",delay:0}],intervals:[]};function load(){try{return {...DEF,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{return {...DEF}}}function save(c){localStorage.setItem(KEY,JSON.stringify(c))}function send(type,x={}){bc.postMessage({type,...x})}
let c=load(),running=false,phase="ready",rem=c.duration,started=0,fired=new Set(),timers=[];const t=document.getElementById('t'),s=document.getElementById('s'),a=document.getElementById('a');function fmt(x){x=Math.max(0,Math.ceil(x));let m=Math.floor(x/60),q=x%60;return String(m).padStart(2,'0')+':'+String(q).padStart(2,'0')}function render(){t.textContent=fmt(rem)}function bell(src){a.pause();a.currentTime=0;a.src=src;let p=a.play();if(p)p.catch(()=>s.textContent='Audio blocked')}function clearT(){timers.forEach(clearTimeout);timers=[]}function starts(){clearT();let z=0;c.startBells.forEach((b,i)=>{if(i)z+=Math.max(0,b.delay)*1000;timers.push(setTimeout(()=>bell(b.sound),z))})}function begin(){phase='practice';running=true;started=performance.now();rem=c.duration;fired=new Set();starts();s.textContent='In practice'}function start(){if(running)return;if(c.warmup>0){phase='warmup';running=true;started=performance.now();rem=c.warmup;s.textContent='Get ready'}else begin()}function pause(){if(!running)return;rem=Math.max(0,rem-(performance.now()-started)/1000);running=false;clearT();s.textContent='Paused'}function resume(){if(running||rem<=0)return;running=true;started=performance.now();s.textContent=phase==='practice'?'In practice':'Get ready'}function reset(){running=false;phase='ready';clearT();rem=c.duration;fired=new Set();s.textContent='Ready';render()}function loop(now){if(running){let e=(now-started)/1000;if(phase==='warmup'){rem=Math.max(0,c.warmup-e);if(rem<=0)begin()}else{rem=Math.max(0,c.duration-e);for(const x of c.intervals){let at=x.min*60;if(e>=at&&e<at+1.2&&!fired.has(x.id)){fired.add(x.id);bell(x.sound)}}if(rem<=0){running=false;phase='complete';clearT();s.textContent='Complete';if(c.endBell)bell(c.defaultBell)}}render()}requestAnimationFrame(loop)}requestAnimationFrame(loop);bc.onmessage=e=>{let m=e.data||{};if(m.type==='config'){c=m.config;save(c);if(!running){rem=c.duration;render()}}else if(m.type==='start')start();else if(m.type==='pause')pause();else if(m.type==='resume')resume();else if(m.type==='reset')reset();else if(m.type==='test')bell(m.sound||c.defaultBell);else if(m.type==='state')send('state',{running,phase,remaining:rem})};render();</script></body></html>
