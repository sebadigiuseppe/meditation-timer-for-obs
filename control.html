<!doctype html><html><head><meta charset="utf-8"><title>Meditation Timer Control</title><style>*{box-sizing:border-box}html,body{margin:0;background:#151716;color:#eee;font-family:Arial}body{padding:14px}h1{font-size:20px;margin:0 0 14px}.grid{display:grid;gap:12px}.field{display:flex;flex-direction:column;gap:5px}label{font-size:11px;color:#aaa}input,select,button{font:13px Arial;border-radius:8px;border:1px solid #3b3d3c;background:#222523;color:#eee;padding:9px}button{cursor:pointer}.primary{background:#d8c8a4;color:#171717;border-color:#d8c8a4;font-weight:700}.section{border-top:1px solid #303331;padding-top:12px}.title{font-size:13px;font-weight:700}.muted{color:#888;font-size:11px;line-height:1.4;margin:5px 0 8px}.row{display:flex;gap:6px;flex-wrap:wrap}.sr{display:grid;grid-template-columns:1fr 90px 34px;gap:6px;margin:5px 0}.ir{display:grid;grid-template-columns:1fr 1fr 34px;gap:6px;margin:5px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.status{text-align:center;background:#202321;color:#aaa;padding:8px;border-radius:7px;font-size:11px}</style></head><body><h1>Meditation Timer</h1><div class="grid"><div class="field"><label>Practice duration (minutes)</label><input id="d" type="number" min="1" max="240" value="20"></div><div class="field"><label>Warm-up (seconds)</label><input id="w" type="number" min="0" max="300" value="10"></div><div class="field"><label>Default / end bell</label><div class="row"><select id="b" style="flex:1"><option value="sounds/Bowl_Bright.mp3">Bowl — Bright</option><option value="sounds/Bowl_Deep.wav">Bowl — Deep</option></select><button id="test" class="primary">Test Bell</button></div></div><label><input id="end" type="checkbox" checked> Play a bell at the end</label><div class="section"><div class="title">Starting bells</div><div class="muted">The first bell plays when warm-up ends. Additional bells can use another sound and a delay.</div><div id="starts"></div><div class="row"><button onclick="setStarts(0)">None</button><button onclick="setStarts(1)">1</button><button onclick="setStarts(2)">2</button><button onclick="setStarts(3)">3</button></div></div><div class="section"><div class="title">Interval bells</div><div class="muted">None by default.</div><div id="ints"></div><button onclick="addInt()">+ Add interval</button><button onclick="ints.innerHTML=''">Clear</button></div><div class="actions"><button onclick="cmd('reset')">Reset</button><button class="primary" onclick="cmd('start')">Start</button><button onclick="cmd('pause')">Pause</button><button onclick="cmd('resume')">Resume</button></div><div id="st" class="status">Ready</div></div><script>const CH="meditation-timer-v2",KEY="meditationTimerConfig";const bc=new BroadcastChannel(CH);const DEF={duration:1200,warmup:10,endBell:true,defaultBell:"sounds/Bowl_Bright.mp3",startBells:[{sound:"sounds/Bowl_Bright.mp3",delay:0}],intervals:[]};function load(){try{return {...DEF,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{return {...DEF}}}function save(c){localStorage.setItem(KEY,JSON.stringify(c))}function send(type,x={}){bc.postMessage({type,...x})}
let c=load();const d=document.getElementById('d'),w=document.getElementById('w'),b=document.getElementById('b'),end=document.getElementById('end'),starts=document.getElementById('starts'),ints=document.getElementById('ints'),st=document.getElementById('st');function row(x,first=false){let r=document.createElement('div');r.className='sr';r.innerHTML=`<select class="ss"><option value="sounds/Bowl_Bright.mp3">Bright</option><option value="sounds/Bowl_Deep.wav">Deep</option></select><input class="sd" type="number" min="0" max="60" value="${first?0:(x.delay||3)}"><button ${first?'disabled':''}>×</button>`;r.querySelector('.ss').value=x.sound;r.querySelector('button').onclick=()=>r.remove();starts.appendChild(r)}function setStarts(n){starts.innerHTML='';for(let i=0;i<n;i++)row({sound:b.value,delay:i?3:0},i===0)}function addInt(x={min:5,sound:b.value}){let r=document.createElement('div');r.className='ir';r.innerHTML=`<input class="im" type="number" min="1" max="239" value="${x.min}"><select class="is"><option value="sounds/Bowl_Bright.mp3">Bright</option><option value="sounds/Bowl_Deep.wav">Deep</option></select><button>×</button>`;r.querySelector('.is').value=x.sound;r.querySelector('button').onclick=()=>r.remove();ints.appendChild(r)}function collect(){return {duration:(Number(d.value)||20)*60,warmup:Number(w.value)||0,endBell:end.checked,defaultBell:b.value,startBells:[...starts.querySelectorAll('.sr')].map((r,i)=>({sound:r.querySelector('.ss').value,delay:i?Number(r.querySelector('.sd').value)||0:0})),intervals:[...ints.querySelectorAll('.ir')].map((r,i)=>({id:'i'+Date.now()+i,min:Number(r.querySelector('.im').value),sound:r.querySelector('.is').value})).filter(x=>x.min>0).sort((a,b)=>a.min-b.min)}}function push(){c=collect();save(c);send('config',{config:c})}function cmd(x){push();send(x)}document.getElementById('test').onclick=()=>send('test',{sound:b.value});bc.onmessage=e=>{let m=e.data||{};if(m.type==='state')st.textContent=m.phase==='warmup'?'Warm-up':m.phase==='practice'?(m.running?'Running':'Paused'):m.phase==='complete'?'Complete':'Ready'};d.value=c.duration/60;w.value=c.warmup;b.value=c.defaultBell;end.checked=c.endBell;setStarts(c.startBells.length);c.startBells.forEach((x,i)=>{if(i){let r=starts.children[i];r.querySelector('.ss').value=x.sound;r.querySelector('.sd').value=x.delay}else if(starts.children[0])starts.children[0].querySelector('.ss').value=x.sound});send('config',{config:c});</script></body></html>
